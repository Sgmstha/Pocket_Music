<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>html,body,#player{margin:0;width:100%;height:100%;min-width:200px;min-height:200px;background:#080809;color:white;font:14px sans-serif}</style></head><body><div id="player">Loading YouTube…</div><script>
const args=new URLSearchParams(location.search),token=args.get('token');let player,ready=false,failed=false,activeId=args.get('id');
function send(type,data={}){Pocket.message(JSON.stringify({token,videoId:activeId,type,...data}));}
function status(){if(ready&&!failed&&player.getVideoData().video_id===activeId)send('status',{state:player.getPlayerState(),position:player.getCurrentTime(),duration:player.getDuration()});}
function loadTrack(id){if(!/^[A-Za-z0-9_-]{11}$/.test(id))return;activeId=id;failed=false;if(ready)player.loadVideoById(id);}
function fail(code){failed=true;if(ready)player.pauseVideo();send('error',{message:({'100':'Video removed, private or unavailable.','101':'Embedding disabled by the owner.','150':'Embedding disabled by the owner.','153':'YouTube rejected this embedded player.','offline':'You are offline.','network':'Could not connect to YouTube.','timeout':'YouTube took too long to load.'})[code]||'Video could not be played.'});}
function command(action,value){if(!ready||failed)return;switch(action){case'play':player.playVideo();break;case'pause':player.pauseVideo();break;case'seek':player.seekTo(Math.max(0,value),true);break;case'volume':player.setVolume(Math.max(0,Math.min(100,value)));if(value>0)player.unMute();break;}status();}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{width:'100%',height:'100%',videoId:activeId,playerVars:{controls:1,playsinline:1,origin:location.origin},events:{onReady:()=>{ready=true;player.setVolume(Number(args.get('volume')??70));if(player.getVideoData().video_id!==activeId)player.loadVideoById(activeId);else player.playVideo();},onStateChange:status,onError:e=>fail(String(e.data)),onAutoplayBlocked:()=>send('blocked')}});};
window.addEventListener('offline',()=>fail('offline'));
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>fail('network');document.head.appendChild(script);setTimeout(()=>{if(!ready)fail('timeout');},30000);setInterval(()=>{if(!document.hidden)status();},1000);
</script></body></html>
